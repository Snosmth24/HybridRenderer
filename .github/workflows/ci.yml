name: CI - Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  unit-tests-windows:
    name: Unit Tests (Windows)
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      timeout-minutes: 5
    
    - name: Verify dependencies
      run: |
        if (!(Test-Path "external\glfw\CMakeLists.txt")) {
          Write-Error "GLFW not found"
          exit 1
        }
        if (!(Test-Path "external\googletest\CMakeLists.txt")) {
          Write-Error "GoogleTest not found"
          exit 1
        }
        if (!(Test-Path "test_assets\test_256x256.png")) {
          Write-Error "Test assets not found"
          exit 1
        }
        Write-Host "✓ Dependencies verified"
        Write-Host "✓ Test assets verified"
      shell: pwsh
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      timeout-minutes: 5
    
    - name: Build Unit Tests
      run: cmake --build build --config Debug --target HybridRenderer_unit_tests -j 4
      timeout-minutes: 10
    
    - name: Copy test assets to build directory
      run: |
        Write-Host "Copying test_assets to build directory..."
        
        # Copy to bin/Debug (where executable is on Windows)
        New-Item -ItemType Directory -Force -Path "build\bin\Debug\test_assets"
        Copy-Item -Path "test_assets\*" -Destination "build\bin\Debug\test_assets\" -Recurse -Force
        
        # Also copy to build root (backup location)
        New-Item -ItemType Directory -Force -Path "build\test_assets"
        Copy-Item -Path "test_assets\*" -Destination "build\test_assets\" -Recurse -Force
        
        Write-Host "✓ Test assets copied"
        Write-Host "Contents of build\bin\Debug\test_assets:"
        Get-ChildItem "build\bin\Debug\test_assets"
      shell: pwsh
    
    - name: Run Tests
      run: |
        cd build
        ctest -C Debug --output-on-failure --verbose
      timeout-minutes: 2

  unit-tests-linux:
    name: Unit Tests (Linux)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      timeout-minutes: 5
    
    - name: Install X11 dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libgl1-mesa-dev \
          libxrandr-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxi-dev \
          libx11-dev
      timeout-minutes: 5
    
    - name: Verify dependencies
      run: |
        if [ ! -f "external/glfw/CMakeLists.txt" ]; then
          echo "ERROR: GLFW not found"
          exit 1
        fi
        if [ ! -f "external/googletest/CMakeLists.txt" ]; then
          echo "ERROR: GoogleTest not found"
          exit 1
        fi
        if [ ! -f "test_assets/test_256x256.png" ]; then
          echo "ERROR: Test assets not found"
          exit 1
        fi
        echo "✓ Dependencies verified"
        echo "✓ Test assets verified"
    
    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      timeout-minutes: 5
    
    - name: Build Unit Tests
      run: cmake --build build --config Debug --target HybridRenderer_unit_tests -j 4
      timeout-minutes: 10
    
    - name: Copy test assets to build directory
      run: |
        echo "Copying test_assets to build directory..."
        
        # Find where the executable actually is
        EXEC_PATH=$(find build -name "HybridRenderer_unit_tests" -type f | head -n 1)
        if [ -n "$EXEC_PATH" ]; then
          EXEC_DIR=$(dirname "$EXEC_PATH")
          echo "Executable found at: $EXEC_PATH"
          echo "Copying to: $EXEC_DIR/test_assets"
          mkdir -p "$EXEC_DIR/test_assets"
          cp -r test_assets/* "$EXEC_DIR/test_assets/"
        fi
        
        # Also copy to build root and build/bin as backup
        mkdir -p build/test_assets
        cp -r test_assets/* build/test_assets/
        
        mkdir -p build/bin/test_assets
        cp -r test_assets/* build/bin/test_assets/
        
        echo "✓ Test assets copied"
        echo "Contents of build/bin/test_assets:"
        ls -la build/bin/test_assets/ || echo "build/bin/test_assets not accessible"
    
    - name: List build artifacts (debug)
      run: |
        echo "=== Build directory structure ==="
        find build -type f -name "*unit_tests*"
        echo ""
        echo "=== Test assets locations ==="
        find build -type d -name "test_assets"
        echo ""
        echo "=== Contents of test_assets in build ==="
        find build -path "*/test_assets/*.png" || echo "No PNG files found in build"
    
    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure --verbose
      timeout-minutes: 2

  status:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests-windows, unit-tests-linux]
    if: always()
    
    steps:
    - name: Generate Summary
      run: |
        echo "# CI Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.unit-tests-windows.result }}" == "success" ]; then
          echo "✅ **Windows Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Windows Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.unit-tests-linux.result }}" == "success" ]; then
          echo "✅ **Linux Tests**: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Linux Tests**: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Details:**" >> $GITHUB_STEP_SUMMARY
        echo "- 49 unit tests (headless, no GPU)" >> $GITHUB_STEP_SUMMARY
        echo "- 11 asset loader tests (with texture loading)" >> $GITHUB_STEP_SUMMARY
        echo "- Tested on Windows and Linux" >> $GITHUB_STEP_SUMMARY
        echo "- Build time: ~2 minutes" >> $GITHUB_STEP_SUMMARY
        echo "- Test time: <1 second" >> $GITHUB_STEP_SUMMARY